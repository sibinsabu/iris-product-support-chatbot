services:
  - type: web
    name: iris-product-support-chatbot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: AZURE_OPENAI_ENDPOINT
        sync: false
      - key: AZURE_OPENAI_API_KEY
        sync: false
      - key: TEXT_MODEL_DEPLOYMENT
        sync: false
      - key: VISION_MODEL_DEPLOYMENT
        sync: false
      - key: IMAGE_MODEL_DEPLOYMENT
        sync: false
      - key: SPEECH_ENDPOINT
        sync: false
      - key: SPEECH_API_KEY
        sync: false
      - key: SPEECH_REGION
        sync: false
      - key: CONTENT_ENDPOINT
        sync: false
      - key: CONTENT_API_KEY
        sync: false
      - key: CONTENT_API_VERSION
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: FIREBASE_APP_ID
        sync: false
