<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <!-- Background subtle soft halo -->
    <radialGradient id="irisHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#4f46e5" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>

    <!-- Vibrant Multi-stop Blade Gradients -->
    <linearGradient id="bladeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="60%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>

    <linearGradient id="bladeGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <linearGradient id="bladeGrad3" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="60%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Core Pupil Glow -->
    <radialGradient id="pupilGrad" cx="42%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#38bdf8"/>
      <stop offset="65%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </radialGradient>

    <!-- Drop Shadow / Glow filter -->
    <filter id="irisGlowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow Backdrop -->
  <circle cx="60" cy="60" r="56" fill="url(#irisHalo)"/>

  <!-- High-Precision Tech Calibration Ring -->
  <circle cx="60" cy="60" r="54" stroke="#4f46e5" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="2 6"/>
  <circle cx="60" cy="60" r="50" stroke="#6366f1" stroke-width="2" stroke-opacity="0.4"/>

  <!-- 6 Overlapping Iris Aperture Blades -->
  <g transform="rotate(0 60 60)">
    <path d="M60 14 C73 14 86 21 94 32 L66 50 Z" fill="url(#bladeGrad1)"/>
  </g>
  <g transform="rotate(60 60 60)">
    <path d="M60 14 C73 14 86 21 94 32 L66 50 Z" fill="url(#bladeGrad2)"/>
  </g>
  <g transform="rotate(120 60 60)">
    <path d="M60 14 C73 14 86 21 94 32 L66 50 Z" fill="url(#bladeGrad3)"/>
  </g>
  <g transform="rotate(180 60 60)">
    <path d="M60 14 C73 14 86 21 94 32 L66 50 Z" fill="url(#bladeGrad1)"/>
  </g>
  <g transform="rotate(240 60 60)">
    <path d="M60 14 C73 14 86 21 94 32 L66 50 Z" fill="url(#bladeGrad2)"/>
  </g>
  <g transform="rotate(300 60 60)">
    <path d="M60 14 C73 14 86 21 94 32 L66 50 Z" fill="url(#bladeGrad3)"/>
  </g>

  <!-- Inner Iris Optical Lens -->
  <circle cx="60" cy="60" r="22" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8"/>
  <circle cx="60" cy="60" r="18" fill="url(#pupilGrad)" filter="url(#irisGlowFilter)"/>

  <!-- Specular Lens Glint & Precision Flare -->
  <ellipse cx="54" cy="53" rx="4.5" ry="3" fill="#ffffff" opacity="0.85" transform="rotate(-25 54 53)"/>
  <circle cx="66" cy="67" r="1.8" fill="#ffffff" opacity="0.6"/>
</svg>
