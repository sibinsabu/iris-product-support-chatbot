<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Iris AI - Precision Hardware Diagnostics &amp; Gadget Repair Advisor for Mobiles, Laptops, Earphones, and Smart Devices.">
  <title>{% block title %}Iris &bull; AI Diagnostic &amp; Gadget Repair Copilot{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=4.0.0">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/iris-logo.svg') }}">
  {% block head %}{% endblock %}
</head>
<body>
  {% block content %}{% endblock %}

  <!-- Confirmation Modal -->
  <div class="modal-backdrop" id="receipt-modal">
    <div class="receipt-card">
      <div class="receipt-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
      </div>
      <h2 class="receipt-title">Order Confirmed!</h2>
      <div class="receipt-order-id" id="receipt-order-id">Order ID: APX-948102</div>
      
      <div class="receipt-details-box">
        <div style="display:flex; justify-content:space-between;">
          <span style="color:var(--text-muted);">Payment Method:</span>
          <span style="font-weight:600; color:var(--text-title);">Apple Pay (Instant)</span>
        </div>
        <div style="display:flex; justify-content:space-between;">
          <span style="color:var(--text-muted);">Total Paid:</span>
          <span style="font-weight:700; color:var(--primary-600);" id="receipt-total">₹2,949</span>
        </div>
        <div style="display:flex; justify-content:space-between;">
          <span style="color:var(--text-muted);">Turnaround:</span>
          <span style="font-weight:600; color:var(--emerald-600);" id="receipt-delivery">Same-Day 45-Min Repair</span>
        </div>
        <div style="display:flex; justify-content:space-between;">
          <span style="color:var(--text-muted);">Pickup / Service:</span>
          <span style="color:var(--text-title);">In-Store Walk-In / Express Courier</span>
        </div>
      </div>

      <div style="display:flex; flex-direction:column; gap:0.5rem;">
        <button class="btn-primary" style="width: 100%;" onclick="trackCurrentReceiptOrder()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:15px;height:15px;display:inline-block;vertical-align:middle;margin-right:4px;"><path d="M10 17h4V5H2v12h3m15 0h2v-3.34a2 2 0 0 0-.59-1.42L18.8 9.66A2 2 0 0 0 17.38 9H14v8h2"></path><circle cx="7" cy="17" r="2"></circle><circle cx="17" cy="17" r="2"></circle></svg>
          Track Live Repair Progress
        </button>
        <button class="btn-primary" style="width: 100%; background:#ffffff; color:var(--text-title); border:1px solid var(--border-light);" onclick="openDiagnosticInvoiceModal()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:15px;height:15px;display:inline-block;vertical-align:middle;margin-right:4px;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
          View Diagnostic &amp; Estimate Sheet
        </button>
        <button style="background:none; border:none; color:var(--text-muted); font-size:0.8rem; cursor:pointer; padding:0.4rem;" onclick="closeReceiptModal()">
          Close
        </button>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
