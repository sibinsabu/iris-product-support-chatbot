<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Iris AI - Precision Hardware Diagnostics &amp; Gadget Repair Advisor for Mobiles, Laptops, Earphones, and Smart Devices.">
  <title>{% block title %}Iris &bull; AI Diagnostic &amp; Gadget Repair Copilot{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=1.0.2">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/iris-logo.svg') }}">
  {% block head %}{% endblock %}
</head>
<body>
  {% block content %}{% endblock %}

  <!-- Confirmation Modal -->
  <div class="modal-backdrop" id="receipt-modal">
    <div class="receipt-card">
      <div class="receipt-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
      </div>
      <h2 class="receipt-title">Order Confirmed!</h2>
      <div class="receipt-order-id" id="receipt-order-id">Order ID: APX-948102</div>
      
      <div class="receipt-details-box">
        <div style="display:flex; justify-content:space-between;">
          <span style="color:var(--text-muted);">Payment Method:</span>
          <span style="font-weight:600; color:var(--text-title);">Apple Pay (Instant)</span>
        </div>
        <div style="display:flex; justify-content:space-between;">
          <span style="color:var(--text-muted);">Total Paid:</span>
          <span style="font-weight:700; color:var(--primary-600);" id="receipt-total">₹2,949</span>
        </div>
        <div style="display:flex; justify-content:space-between;">
          <span style="color:var(--text-muted);">Turnaround:</span>
          <span style="font-weight:600; color:var(--emerald-600);" id="receipt-delivery">Same-Day 45-Min Repair</span>
        </div>
        <div style="display:flex; justify-content:space-between;">
          <span style="color:var(--text-muted);">Pickup / Service:</span>
          <span style="color:var(--text-title);">In-Store Walk-In / Express Courier</span>
        </div>
      </div>

      <button class="btn-primary" style="width: 100%;" onclick="closeReceiptModal()">
        Done
      </button>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
